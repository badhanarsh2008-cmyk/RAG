<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT</title>
    <link rel="stylesheet" href="/static/chat-room_style.css">
</head>
<body>
    <main class="chat">
        <section id="messages" class="messages"></section>

        <form id="chat-form" class="chat-composer">
            <input id="question" type="text" placeholder="Ask something..." required>
            <button type="submit">Send</button>
        </form>
    </main>
    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const messages = document.getElementById("messages");

        function addmessage(text, role) {
            const box = document.createElement('div');
            box.className = `message ${role}`;
            box.textContent = text;
            messages.appendChild(box);
            return box;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = input.value.trim();
            if (!question) return;

            addmessage(question, "user");
            input.value = "";

            const answerbox = addmessage("Thinking...", "bot");
            try {
                const response = await fetch("/ask", {
                    method : "POST",
                    headers : { "Content-Type" : "application/json"},
                    body : JSON.stringify({ question })
                });
                const data = await response.json();
                answerbox.textContent = response.ok ? data.answer : data.detail || "Could not get an answer.";
            } catch {
                answerbox.textContent = "Could not connect to the server.";
            }
        });
    </script>
</body>

</html>
